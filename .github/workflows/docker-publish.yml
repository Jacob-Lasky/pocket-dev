name: Build and Push Docker Image

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # Weekly refresh, because three tools in this image are installed UNPINNED on
  # purpose (claude via install.sh, codex via npm -g, gh via apt stable) and
  # therefore only move when a build runs. Without this they freeze at whatever
  # was current the last time someone merged something, which is exactly what
  # happened: the running container sat on codex 0.153.0 while upstream was on
  # 0.153.4.
  #
  # Monday 06:00 UTC. Deliberately NOT paired with an automatic deploy: see the
  # no-cache note below and the Tower user script `pocket-dev-codex-update`.
  schedule:
    - cron: '0 6 * * 1'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          # amd64 only: pocket-dev runs exclusively on the Tower (amd64) host;
          # phone/desktop access is browser UI, not the image. Building arm64
          # under QEMU emulation roughly doubled build time (emulated tailscale
          # Go compile + node-pty native build) for a target nothing runs.
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          # THE SCHEDULED BUILD MUST IGNORE THE LAYER CACHE, or it is decorative.
          #
          # `cache-from: type=gha` below is what makes ordinary builds fast, and
          # it is also what would defeat the whole point of the weekly run: a
          # layer's cache key is derived from the Dockerfile instruction and the
          # layers before it, NOT from what `npm install -g @openai/codex` would
          # resolve to today. So an unchanged Dockerfile means that RUN is a
          # cache HIT and the "unpinned so it tracks upstream" comment in the
          # Dockerfile quietly stops being true.
          #
          # Only the scheduled event pays for this. Push and PR builds keep the
          # cache, which matters because this image compiles node-pty natively.
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
