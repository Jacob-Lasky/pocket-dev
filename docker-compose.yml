version: '3.8'

services:
  pocket-dev:
    build: .
    container_name: pocket-dev
    restart: unless-stopped

    # Unraid user permissions (nobody:users)
    user: "99:100"

    environment:
      # Optional: Add your Anthropic API key here or use .env file
      # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - PUID=99
      - PGID=100

    volumes:
      # Persistent workspace and config
      - ./workspace:/workspace
      - ./config:/home/claude/.claude

      # Open sessions + each tab's Claude conversation id. Without this the
      # roster lives in the writable layer, so `docker compose up --build`
      # (a recreate) loses your tabs; with it they come back and resume.
      - ./state:/home/claude/.pocket-dev

      # Auth and self-installed tooling that must outlive a recreate. NOTE the
      # gh mount is .config/gh specifically, and tools go to /opt/pd: do NOT
      # mount /home/claude/.local, which would mask the claude and uv binaries
      # baked into the image.
      - ./gh:/home/claude/.config/gh
      - ./tools:/opt/pd

      # Docker socket. WARNING: :ro does NOT make the Docker API read-only. It
      # marks the socket file read-only and nothing else — the daemon still
      # honours run / stop / rm over it, so this mount is effectively host root
      # for anything in the container. Drop it, or front it with a filtered
      # docker-socket-proxy, if that is not what you want.
      - /var/run/docker.sock:/var/run/docker.sock:ro

    ports:
      # Web terminal — Express serving xterm.js client + WebSocket /ws upgrade.
      # 7682 used to be a separate mobile-input-bridge port; that bridge was
      # removed when the stack switched to a single node-pty server in 4548bf8,
      # so only 7681 is published now.
      - "7681:7681"

    # Add to docker group to access socket
    # Unraid's docker group GID is 281
    group_add:
      - 281
