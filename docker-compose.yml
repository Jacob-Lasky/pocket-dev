version: '3.8'

services:
  pocket-dev:
    build: .
    container_name: pocket-dev
    restart: unless-stopped

    # Unraid user permissions (nobody:users)
    user: "99:100"

    environment:
      # Optional: Add your Anthropic API key here or use .env file
      # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - PUID=99
      - PGID=100

      # The hostname YOU reach this container by, written into the review URLs
      # Lavish prints. Blank means the URL carries the container's own 172.x
      # bridge address, which resolves nowhere outside the container. For a local
      # compose run localhost is right; on a remote host use its LAN IP or
      # Tailscale name, and add whatever other names you might type to
      # LAVISH_AXI_ALLOWED_HOSTS so Lavish's Host allowlist does not 403 them.
      - LAVISH_AXI_LINK_HOST=localhost

    volumes:
      - ./workspace:/workspace

      # The whole home, and the only state mount there is. Claude's config and
      # conversation ids, the gh token, the dgvpn registration, and credentials
      # for tools that were never on a mount list (aws, kubectl, fly) all persist
      # across a `docker compose up --build` recreate.
      #
      # Mounting the home used to be forbidden because it masked the claude and
      # uv binaries baked into /home/claude/.local. It is safe now only because
      # the image keeps its artifacts in /opt/pd-home and ships this path EMPTY,
      # with entrypoint.sh linking them back in. DO NOT add a second mount at a
      # path underneath this one: it shadows part of the home with another host
      # dir, and state starts landing in two places at once.
      - ./home:/home/claude

      # Docker socket. WARNING: :ro does NOT make the Docker API read-only. It
      # marks the socket file read-only and nothing else — the daemon still
      # honours run / stop / rm over it, so this mount is effectively host root
      # for anything in the container. Drop it, or front it with a filtered
      # docker-socket-proxy, if that is not what you want.
      - /var/run/docker.sock:/var/run/docker.sock:ro

    ports:
      # Web terminal — Express serving xterm.js client + WebSocket /ws upgrade.
      # 7682 used to be a separate mobile-input-bridge port; that bridge was
      # removed when the stack switched to a single node-pty server in 4548bf8,
      # so only 7681 is published now.
      - "7681:7681"

      # Lavish Editor's review server. `lavish-axi <file.html>` inside the
      # container prints a URL for a human to open; without this mapping that
      # URL only resolves from inside. entrypoint.sh binds it to the container's
      # own IP because Lavish refuses a wildcard bind, and on a BRIDGE network
      # Docker's published port DNATs to exactly that address. Under
      # `--network host` there is no DNAT and this mapping is ignored, so set
      # LAVISH_AXI_HOST yourself there. Unauthenticated, like 7681, whose
      # number this one is deliberately one above.
      - "7682:7682"

    # Add to docker group to access socket
    # Unraid's docker group GID is 281
    group_add:
      - 281

    # The three below mirror pocket-dev.xml's ExtraParams. README calls this file
    # a mirror of the UnRAID template, and it had silently stopped being one: the
    # memory cap and SYS_PTRACE lived only in the template, so a local `compose up`
    # ran uncapped and behaved differently from the deployed container in ways
    # nothing reported. Keep the two files in step; codex.test.js asserts it.

    # Codex sandboxes every command it spawns with bubblewrap, which needs an
    # unprivileged user namespace. Docker's default seccomp profile denies that,
    # and `codex exec review` then aborts before reading any file while still
    # printing "No findings were identified". Measured 2026-08-15: this is the only
    # knob that works (apparmor is not the blocker; SYS_ADMIN clears unshare then
    # fails on pivot_root; codex's own use_legacy_landlock is deprecated and fails
    # with Sandbox(LandlockRestrict)). This IS a real loosening, defensible only
    # because the docker socket above is already host-root equivalent.
    security_opt:
      - seccomp:unconfined

    # Debuggers attaching to child processes inside the container.
    cap_add:
      - SYS_PTRACE

    # Matches the template. An uncapped container on a host running other
    # workloads is how a runaway compile takes the whole box down.
    mem_limit: 16g
