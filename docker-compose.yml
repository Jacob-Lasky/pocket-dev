version: '3.8'

services:
  pocket-dev:
    build: .
    container_name: pocket-dev
    restart: unless-stopped

    # Unraid user permissions (nobody:users)
    user: "99:100"

    environment:
      # Optional: Add your Anthropic API key here or use .env file
      # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - PUID=99
      - PGID=100

    volumes:
      - ./workspace:/workspace

      # The whole home, and the only state mount there is. Claude's config and
      # conversation ids, the gh token, the dgvpn registration, and credentials
      # for tools that were never on a mount list (aws, kubectl, fly) all persist
      # across a `docker compose up --build` recreate.
      #
      # Mounting the home used to be forbidden because it masked the claude and
      # uv binaries baked into /home/claude/.local. It is safe now only because
      # the image keeps its artifacts in /opt/pd-home and ships this path EMPTY,
      # with entrypoint.sh linking them back in. DO NOT add a second mount at a
      # path underneath this one: it shadows part of the home with another host
      # dir, and state starts landing in two places at once.
      - ./home:/home/claude

      # Docker socket. WARNING: :ro does NOT make the Docker API read-only. It
      # marks the socket file read-only and nothing else — the daemon still
      # honours run / stop / rm over it, so this mount is effectively host root
      # for anything in the container. Drop it, or front it with a filtered
      # docker-socket-proxy, if that is not what you want.
      - /var/run/docker.sock:/var/run/docker.sock:ro

    ports:
      # Web terminal — Express serving xterm.js client + WebSocket /ws upgrade.
      # 7682 used to be a separate mobile-input-bridge port; that bridge was
      # removed when the stack switched to a single node-pty server in 4548bf8,
      # so only 7681 is published now.
      - "7681:7681"

    # Add to docker group to access socket
    # Unraid's docker group GID is 281
    group_add:
      - 281
