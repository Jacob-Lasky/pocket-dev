allowBuilds:
  esbuild: true
  node-pty: true
# pnpm settings live here, NOT in package.json: pnpm 11 stopped reading the
# "pnpm" field and warns that the keys were ignored (https://pnpm.io/settings).
#
# node-pty ships no linux-x64 prebuild, so it MUST compile at install time or
# every server suite dies with "Cannot find module ./prebuilds/linux-x64//pty.node".
# pnpm blocks dependency build scripts by default, so it has to be listed here.
onlyBuiltDependencies:
  - node-pty
  - esbuild
