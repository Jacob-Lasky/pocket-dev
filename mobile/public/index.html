        if (listDrag?.el === slGroupEls.get(gid).head) cancelListDrag();
        slGroupEls.get(gid).head.remove();
        slGroupEls.delete(gid);
      }
      for (const id of [...slRowEls.keys()]) {
        if (!sessions.has(id)) dropSessionRow(id);
      }

      // Put each element in the right place only if it is not already there,
      // so a steady-state render moves nothing. Skipped entirely while a drag
      // is in progress: the drag is moving these same nodes, and a background
      // session's output re-rendering the list must not yank one out from
      // under the pointer. The text updates above still land.
      if (!listDrag) {
        let cursor = slRows.firstElementChild;
        for (const el of sequence) {
          if (el === cursor) cursor = cursor.nextElementSibling;
          else slRows.insertBefore(el, cursor);
        }
        // Whatever is left is a row inside a collapsed group: detached, but
        // kept in the cache so expanding the group reuses it.
        while (cursor) {
          const next = cursor.nextElementSibling;
          cursor.remove();
          cursor = next;
        }
      }

      setText(slCount, summarise(listed, activeId));
    }

    // The badge is the reason to poll while you are inside a session: it is how
    // you learn another one wants you without leaving this one. It says which of
    // the two things it is, because a dot that also lit for "working" was on
    // almost permanently and so answered nothing.
    function updateSessionsBadge() {
      const badge = badgeState([...sessions.values()], activeId);
      if (badge) sessionsBtn.dataset.badge = badge;
      else delete sessionsBtn.dataset.badge;
    }

    let metaTimer = null;
    function scheduleMetaPoll() {
      clearTimeout(metaTimer);
      // The interval is the badge's worst-case latency, since arriving bytes no
      // longer flag anything in the browser. pollDelay owns the reasoning.
      const delay = pollDelay({
        listOpen:  document.body.dataset.view === 'list',
        sessions:  sessions.values(),
        activeId,
      });
      metaTimer = setTimeout(async () => {
        if (document.visibilityState === 'visible') {
          await refreshSessionMeta();
          if (document.body.dataset.view === 'list') renderSessionList();
        }
        scheduleMetaPoll();
      }, delay);
    }

    window.openSessionList = async function() {
      disarmKill();
      document.body.dataset.view = 'list';
      renderSessionList();
      await refreshSessionMeta();
      renderSessionList();
      scheduleMetaPoll();
    };

    window.closeSessionList = function() {
      document.body.dataset.view = 'session';
      markViewed(activeId);
      updateSessionsBadge();
      const s = sessions.get(activeId);
      if (s) s.fitAndResize();
      scheduleMetaPoll();
    };

    // Takes the provider as an argument straight from the onclick attribute.
    // onclick-coverage.test.js captures the bare identifier before the paren,
    // so an argument in the attribute is fine and this stays exposed via the
    // `window.` assignment. A NEW handler name would have to be added to the
    // Object.assign block at the bottom in the same change.
    window.newSessionFromList = async function(provider) {
      await createSession(provider);
      closeSessionList();
    };

    // ── Session groups ──────────────────────────────────────────────────────
    // Every edit is optimistic: the new layout renders at once and is PUT to
    // the server, whose normalised answer then replaces it. Edits always start
    // from arrange(), not the raw layout, so an index read off the screen
    // means the same thing in the layout it is applied to.
    const undoBtn      = document.getElementById('sl-undo');
    const autogroupBtn = document.getElementById('sl-autogroup');
    const toolsMsg     = document.getElementById('sl-tools-msg');
    let undoSnapshot   = null;

    function setToolsMsg(text, tone) {
      toolsMsg.textContent = text;
      if (tone) toolsMsg.dataset.tone = tone; else delete toolsMsg.dataset.tone;
    }

    const shownLayout = () => arrange(layout, order);
    const sameLayout  = (a, b) => JSON.stringify(a) === JSON.stringify(b);

    function afterLayoutChange() {
      undoBtn.hidden = !undoSnapshot;
      updateSessionLabel();
      updateDocumentTitle();
      if (document.body.dataset.view === 'list') renderSessionList();
    }

    // Undo covers the two edits that rearrange things you did not just point
    // at (Autogroup, removing a group). Any other edit retires it, because
    // undoing past that edit would silently revert it too.
    function commitLayout(next, { undoable = false } = {}) {
      undoSnapshot = undoable ? shownLayout() : null;
      layout = { ...next, rev: layoutRev };
      afterLayoutChange();
      layoutQueued = next;
      if (!layoutSaving) flushLayoutSaves();
    }

    // Saves go out ONE AT A TIME, newest wins. Two PUTs in flight together can
    // reach the server in either order, and the server keeps whichever lands
    // last, so a quick second edit could be overwritten by the first. Each PUT
    // names the revision it was made from, so an edit made against a list
    // another device has since changed is refused rather than clobbering it.
    async function flushLayoutSaves() {
      layoutSaving = true;
      try {
        while (layoutQueued) {
          const body = layoutQueued;
          layoutQueued = null;
          let r, data;
          try {
            r = await fetch('/layout', {
              method:  'PUT',
              headers: { 'Content-Type': 'application/json' },
              body:    JSON.stringify({ ...body, baseRev: layoutRev }),
            });
            data = await r.json().catch(() => ({}));
          } catch (e) {
            setToolsMsg('Could not save the groups. Check the connection.', 'error');
            continue;
          }
          if (r.ok) {
            layoutRev = data.rev;
            // A newer edit is already queued; showing this one would flicker.
            if (!layoutQueued) { adoptLayout(data); afterLayoutChange(); }
          } else {
            // Conflict or a failed write: show what the server really holds,
            // and drop anything queued behind it, which was built on the edit
            // that just failed.
            layoutQueued = null;
            undoSnapshot = null;
            if (data.layout) { adoptLayout(data.layout); afterLayoutChange(); }
            setToolsMsg(r.status === 409
              ? 'The list changed on another device, so that change was not saved.'
              : `Could not save the groups: ${data.error || `HTTP ${r.status}`}.`, 'error');
          }
        }
      } finally {
        layoutSaving = false;
      }
    }

    function toggleGroupCollapsed(gid) {
      commitLayout(toggleGroup(shownLayout(), gid));
    }

    function removeGroup(gid) {
      const name = shownLayout().groups.find((g) => g.id === gid)?.name;
      commitLayout(deleteGroup(shownLayout(), gid), { undoable: true });
      setToolsMsg(`Removed "${name}". Its sessions moved to Ungrouped.`);
    }

    // Rename in place: the name becomes a text field. Enter or leaving the
    // field saves, Escape cancels. The field sits BESIDE the toggle button
    // rather than in it, since an input inside a button is not focusable.
    function startRename(gid) {
      renderSessionList();
      const h = slGroupEls.get(gid);
      if (!h || h.head.querySelector('.sl-group-input')) return;
      const before = h.name.textContent;
      const input = document.createElement('input');
      input.className = 'sl-group-input';
      input.maxLength = MAX_NAME_LENGTH;
      input.value = before;
      input.setAttribute('aria-label', 'Group name');
      h.toggle.hidden = true;
      h.toggle.after(input);
      input.focus();
      input.select();

      let done = false;
      const finish = (save) => {
        if (done) return;
        done = true;
        const name = input.value.trim();
        input.remove();
        h.toggle.hidden = false;
        if (save && name && name !== before) commitLayout(renameGroup(shownLayout(), gid, name));
      };
      input.addEventListener('keydown', (e) => {
        // stopPropagation keeps Escape from also closing the whole list.
        if (e.key === 'Enter')  { e.preventDefault(); finish(true); }
        if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); finish(false); }
      });
      input.addEventListener('blur', () => finish(true));
    }

    // Rename a session in place, the same way a group is renamed: the row
    // becomes a text field. It starts from what the row shows now, so naming
    // means editing rather than retyping. Saving the automatic text unchanged
    // does nothing, so a session is not frozen at today's title by accident;
    // saving an empty field clears a given name and the conversation's own
    // title takes over again. The name is pocket-dev's: it is not typed into
    // Claude, so Remote Control keeps its own.
    function startSessionRename(id) {
      const refs = slRowEls.get(id);
      const s = sessions.get(id);
      if (!refs || !s || refs.item.querySelector('.sl-session-input')) return;
      const given = sessionName(layout, id);
      const automatic = automaticName(s, id) || '';
      const input = document.createElement('input');
      input.className = 'sl-session-input';
      input.maxLength = MAX_SESSION_NAME_LENGTH;
      // Assigning .value bypasses maxLength, and a conversation title can be
      // longer than a name may be; clip it here so what is edited is what
      // can be saved.
      input.value = (given ?? automatic).slice(0, MAX_SESSION_NAME_LENGTH);
      input.placeholder = automatic || 'Name this session';
      input.setAttribute('aria-label', 'Session name');
      refs.row.hidden = true;
      refs.row.after(input);
      input.focus();
      input.select();

      let done = false;
      const finish = (save) => {
        if (done) return;
        done = true;
        const name = cleanSessionName(input.value);
        input.remove();
        refs.row.hidden = false;
        if (!save) return;
        if (given === undefined
          ? (!name || name === cleanSessionName(automatic))
          : name === given) return;
        commitLayout(renameSession(shownLayout(), id, name));
      };
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter')  { e.preventDefault(); finish(true); }
        if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); finish(false); }
      });
      input.addEventListener('blur', () => finish(true));
    }

    window.newGroup = function() {
      // The server keeps at most MAX_GROUPS; offering one more would show a
      // group that vanishes the moment the save comes back.
      if (shownLayout().groups.length >= MAX_GROUPS) {
        setToolsMsg(`That is the most groups the list holds (${MAX_GROUPS}).`, 'error');
        return;
      }
      const id = newGroupId();
      commitLayout(addGroup(shownLayout(), id, 'New group'));
      setToolsMsg('Name the group, then drag sessions into it.');
      startRename(id);
    };

    window.autogroupSessions = async function() {
      autogroupBtn.disabled = true;
      setToolsMsg('Grouping by topic…');
      const before = shownLayout();
      try {
        const r = await fetch('/layout/autogroup', { method: 'POST' });
        const body = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(body.error || `HTTP ${r.status}`);
        // The server has already saved this, at a newer revision than any poll
        // already in flight, so those polls are discarded on arrival. Undo
        // restores what the server applied it to, which includes any edit
        // made while the model was thinking; `before` is only the fallback
        // for a server that does not send it.
        const { previous, ...grouped } = body;
        undoSnapshot = previous ? arrange(previous, order) : before;
        adoptLayout(grouped);
        afterLayoutChange();
        const count = grouped.groups.reduce((n, g) => n + g.sessions.length, 0);
        setToolsMsg(grouped.groups.length
          ? `Grouped ${count} session${count === 1 ? '' : 's'} into ${grouped.groups.length} group${grouped.groups.length === 1 ? '' : 's'}.`
          : 'No clear groups found.');
      } catch (e) {
        setToolsMsg(`Autogroup failed: ${e.message}`, 'error');
      } finally {
        autogroupBtn.disabled = false;
      }
    };

    window.undoLayout = function() {
      if (!undoSnapshot) return;
      commitLayout(undoSnapshot);
      setToolsMsg('Put back the previous grouping.');
    };

    // ── Drag to reorder ─────────────────────────────────────────────────────
    // Pointer events, NOT HTML5 drag and drop: HTML5 DnD never fires for a
    // finger on mobile browsers, and the phone is a primary client.
    //
    // The dragged node itself moves through the list as the pointer crosses
    // its neighbours' midpoints, so what you see during the drag is exactly
    // the order you get on release. Capture is set on #sl-rows, NOT on the
    // grip: moving a node removes and re-inserts it, and removing the capture
    // target releases the capture, which ends the drag after the first step.
    function installListDrag() {
      const EDGE = 48;    // px from the list's top or bottom edge that scrolls it
      let raf = 0;

      const midY = (el) => {
        const r = el.getBoundingClientRect();
        return r.top + r.height / 2;
      };

      function moveTo(el, before) {
        if (before === el) return;
        if (before ? el.nextElementSibling === before : slRows.lastElementChild === el) return;
        slRows.insertBefore(el, before);
      }

      function placeDragged() {
        const { el, kind, y } = listDrag;
        const others = [...slRows.children].filter((c) => c !== el);
        if (kind === 'group') {
          // Groups move among headers only, and always stay above Ungrouped.
          const heads = others.filter((c) => c.classList.contains('sl-group'));
          const rest  = heads.find((h) => h.dataset.groupId === UNGROUPED) || null;
          moveTo(el, heads.find((h) => h !== rest && midY(h) > y) || rest);
          return;
        }
        let before = others.find((c) => midY(c) > y) || null;
        // Never above the first header: a row there would belong to no group.
        const first = others.find((c) => c.classList.contains('sl-group'));
        if (first && before === first) before = others[others.indexOf(first) + 1] || null;
        moveTo(el, before);
      }

      function tick() {
        if (!listDrag) return;
        const r = slRows.getBoundingClientRect();
        const y = listDrag.y;
        let dy = 0;
        if (y < r.top + EDGE)         dy = -Math.ceil((r.top + EDGE - y) / 4);
        else if (y > r.bottom - EDGE) dy =  Math.ceil((y - (r.bottom - EDGE)) / 4);
        if (dy) {
          slRows.scrollTop += dy;
          placeDragged();
        }
        raf = requestAnimationFrame(tick);
      }

      // Where the node ended up, read back as a layout edit: the nearest header
      // above a row is its group, and the rows between them are its index.
      //
      // A collapsed group has no rows in the DOM to count, so a row landing
      // under its header goes to the END of it, like dropping into a folder,
      // unless `enteredFromAbove` (a keyboard step down across the header),
      // where the start is the place it was walking towards.
      function dropResult(d, { enteredFromAbove = false } = {}) {
        const base = shownLayout();
        if (d.kind === 'group') {
          const gid = d.el.dataset.groupId;
          const heads = [...slRows.children]
            .filter((c) => c.classList.contains('sl-group') && c.dataset.groupId !== UNGROUPED)
            .map((c) => c.dataset.groupId);
          return moveGroup(base, gid, heads.indexOf(gid));
        }
        let gid = UNGROUPED;
        let index = 0;
        for (let p = d.el.previousElementSibling; p; p = p.previousElementSibling) {
          if (p.classList.contains('sl-group')) { gid = p.dataset.groupId; break; }
          index++;
        }
        const into = base.groups.find((g) => g.id === gid);
        if (into?.collapsed && !enteredFromAbove) index = into.sessions.length;
        return moveSession(base, d.el.dataset.sessionId, gid, index);
      }

      // The keyboard path: Up/Down on a focused grip moves its row or group one
      // place, through the same DOM-then-dropResult path a drag takes, so the
      // two cannot disagree about what a position means. A row moving past a
      // header changes group, exactly as dragging it there would.
      function stepKey(e) {
        const grip = e.target.closest?.('.sl-grip');
        if (!grip || grip.classList.contains('sl-grip-none') || listDrag) return;
        if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
        e.preventDefault();
        const el = grip.parentElement;
        const up = e.key === 'ArrowUp';
        const kind = el.classList.contains('sl-group') ? 'group' : 'session';
        const isHead = (c) => c?.classList.contains('sl-group');
        if (kind === 'group') {
          const heads = [...slRows.children].filter((c) => isHead(c) && c.dataset.groupId !== UNGROUPED);
          const i = heads.indexOf(el);
          const swap = heads[up ? i - 1 : i + 1];
          if (!swap) return;
          slRows.insertBefore(el, up ? swap : swap.nextElementSibling);
        } else {
          const prev = el.previousElementSibling;
          const next = el.nextElementSibling;
          if (up) {
            // Directly under the first header there is nowhere further up.
            if (!prev || (isHead(prev) && !prev.previousElementSibling)) return;
            slRows.insertBefore(el, prev);
          } else {
            if (!next) return;
            slRows.insertBefore(el, next.nextElementSibling);
          }
        }
        const next = dropResult({ el, kind }, { enteredFromAbove: !up });
        if (!sameLayout(next, shownLayout())) commitLayout(next);
        else renderSessionList();
        // Moving a node can drop its focus; keep the keyboard where it was.
        grip.focus();
      }

      function endDrag(commit, { render = true } = {}) {
        const d = listDrag;
        listDrag = null;
        cancelAnimationFrame(raf);
        try { slRows.releasePointerCapture(d.pointerId); } catch { /* already released */ }
        d.el.classList.remove('sl-dragging');
        delete slRows.dataset.dragging;
        if (commit) {
          const next = dropResult(d);
          if (!sameLayout(next, shownLayout())) {
            commitLayout(next);
            return;
          }
        }
        // Cancelled, or dropped where it started: put back whatever moved.
        if (render) renderSessionList();
      }

      slRows.addEventListener('pointerdown', (e) => {
        const grip = e.target.closest('.sl-grip');
        if (!grip || grip.classList.contains('sl-grip-none') || listDrag) return;
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        const el = grip.parentElement;
        // Stops text selection on desktop and the long-press menu on a phone.
        e.preventDefault();
        listDrag = {
          el,
          kind: el.classList.contains('sl-group') ? 'group' : 'session',
          pointerId: e.pointerId,
          y: e.clientY,
        };
        slRows.setPointerCapture(e.pointerId);
        el.classList.add('sl-dragging');
        slRows.dataset.dragging = listDrag.kind;
        raf = requestAnimationFrame(tick);
      });
      // No render here: the caller IS the renderer (or removeSession on its
      // way to one), and a nested render would sweep the caches it is walking.
      cancelListDrag = () => { if (listDrag) endDrag(false, { render: false }); };
      slRows.addEventListener('pointermove', (e) => {
        if (!listDrag || e.pointerId !== listDrag.pointerId) return;
        listDrag.y = e.clientY;
        placeDragged();
      });
      slRows.addEventListener('pointerup', (e) => {
        if (listDrag && e.pointerId === listDrag.pointerId) endDrag(true);
      });
      slRows.addEventListener('pointercancel', (e) => {
        if (listDrag && e.pointerId === listDrag.pointerId) endDrag(false);
      });
      slRows.addEventListener('keydown', stepKey);
      // Capture phase, so Escape cancels the drag without also closing the list.
      document.addEventListener('keydown', (e) => {
        if (listDrag && e.key === 'Escape') {
          e.stopImmediatePropagation();
          endDrag(false);
        }
      }, true);
    }
    installListDrag();

    // ── Resync ──────────────────────────────────────────────────────────────
    // Reconcile the panes on screen with the sessions the server actually has.
    // This is the recovery path for an outage the tab slept through: the
    // container restarts, the server restores its roster, and we adopt whatever
    // it came back with — same ids (the normal case, so the existing panes just
    // reconnect), different ids (state was lost in a recreate), or none at all.
    let resyncTimer   = null;
    let resyncRunning = false;

    function scheduleResync() {
      if (resyncTimer) return;
      // Several sessions typically fail at once; collapse them into one pass.
      resyncTimer = setTimeout(() => { resyncTimer = null; resyncSessions(); }, 250);
    }

    async function resyncSessions() {
      if (resyncRunning) return;
      resyncRunning = true;
      try {
        let list;
        try {
          list = await listSessions();
        } catch (e) {
          // Server still unreachable. The per-session reconnect timers keep
          // trying, and each 4404 reschedules us, so there is nothing to do.
          return;
        }
        const serverIds = new Set(list.map(s => s.id));
        // Adopt first, drop second: removeSession picks a fallback to make
        // active, and it should have the new panes to choose from.
        for (const { id } of list) if (!sessions.has(id)) addSession(id);
        for (const id of [...sessions.keys()]) if (!serverIds.has(id)) removeSession(id);
        if (!sessions.size) {
          try { await createSession(); } catch (e) { console.warn('resync createSession failed', e); }
          return;
        }
        if (!activeId || !sessions.has(activeId)) setActive(order[0]);
        applySessionMeta(list);
      } finally {
        resyncRunning = false;
      }
    }

    // Coming back to a backgrounded tab is exactly when a restart is most
    // likely to have happened without us noticing.
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        sessions.get(activeId)?.fitAndResize();
        scheduleResync();
      }
    });

    // Two desktop windows can both remain visible. Focus is the unambiguous
    // signal that this browser is now the active grid authority.
    window.addEventListener('focus', () => {
      sessions.get(activeId)?.fitAndResize();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && document.body.dataset.view === 'list') closeSessionList();
    });

    // ── Bootstrap ───────────────────────────────────────────────────────────
    async function bootstrap() {
      applyConnStatusToDot('connecting');
      let list = [];
      // The layout rides along so the `n/m` counter is in display order from
      // the first paint. refreshLayout swallows its own failures.
      try { [list] = await Promise.all([listSessions(), refreshLayout()]); }
      catch (e) { console.warn('listSessions failed', e); }
      if (!list.length) {
        // /sessions may be missing entirely (static-mode tests boot createApp()
        // without sessionsApi). Swallow the error and leave the UI idle.
        try { await createSession(); }
        catch (e) { console.warn('createSession failed', e); }
      } else {
        // Sessions already exist: either another browser is attached, or the
        // server restored them after a restart. Adopt them all.
        for (const { id } of list) addSession(id);
        setActive(list[0].id);
        applySessionMeta(list);
      }
    }

    // Copy helpers, scoped to the active session.
    window.copyAllOutput = async function() {
      const session = sessions.get(activeId);
      const term = session?.term;
      const text = term ? (term.hasSelection()
        ? session.selection.copyText()
        : cleanCopyText(renderTerminalText(term, { viewportOnly: true }))) : '';
      flashCopyButton(await clipboardWrite(text));
    };

    function flashCopyButton(ok) {
      const btn = document.getElementById('copy-btn');
      const orig = btn.textContent;
      btn.textContent = ok ? '✓' : '✗';
      setTimeout(() => { btn.textContent = orig; }, 800);
    }

    // ── Toolbar collapse ────────────────────────────────────────────────────
    const btnGroup    = document.getElementById('btn-group');
    const collapseBtn = document.getElementById('collapse-btn');
    let toolbarCollapsed = savedCollapsed;
    btnGroup.classList.toggle('collapsed', toolbarCollapsed);
    collapseBtn.classList.toggle('collapsed', toolbarCollapsed);

    function toggleCollapse() {
      toolbarCollapsed = !toolbarCollapsed;
      btnGroup.classList.toggle('collapsed', toolbarCollapsed);
      collapseBtn.classList.toggle('collapsed', toolbarCollapsed);
      localStorage.setItem('pd-toolbar-collapsed', toolbarCollapsed);
      requestAnimationFrame(() => {
        const s = sessions.get(activeId);
        s && s.fitAndResize();
        positionScrollBtn();
      });
    }

    // ── Scroll-to-bottom button ────────────────────────────────────────────
    function updateScrollBtn() {
      const s = sessions.get(activeId);
      if (!s) { scrollBtn.classList.remove('visible'); return; }
      const atBottom = s.isAtBottom();
      scrollBtn.classList.toggle('visible', !atBottom);
      if (atBottom) scrollBtn.classList.remove('has-new-output');
    }

    function scrollToBottom() {
      const s = sessions.get(activeId);
      if (!s) return;
      // Pressing the button is an explicit "follow again", so it re-arms the
      // guard as well as moving the viewport.
      s.follow = true;
      s.term.scrollToBottom();
      scrollBtn.classList.remove('has-new-output');
    }

    function positionScrollBtn() {
      const controls = document.getElementById('controls');
      scrollBtn.style.bottom = (controls.offsetHeight + 12) + 'px';
    }

    // ── Resize wiring ──────────────────────────────────────────────────────
    function fitActive() {
      const s = sessions.get(activeId);
      s && s.fitAndResize();
    }

    window.addEventListener('resize', () => { fitActive(); positionScrollBtn(); });

    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', () => {
        document.getElementById('app').style.height = window.visualViewport.height + 'px';
        fitActive();
        positionScrollBtn();
      });
    }

    // Auto-refit whenever the terminal box actually changes size. xterm's fit is
    // a snapshot of the container at one instant; if layout settles to a
    // different size afterwards (browser chrome show/hide, rotation, font load,
    // late reflow) nothing re-fits and the live grid renders jumbled — until the
    // user pokes it (e.g. collapsing/expanding the toolbar). A ResizeObserver
    // makes that workaround automatic and covers
    // size changes the window/visualViewport 'resize' events miss.
    if (window.ResizeObserver) {
      let roTimer = null;
      const ro = new ResizeObserver(() => {
        clearTimeout(roTimer);
        roTimer = setTimeout(() => { fitActive(); positionScrollBtn(); }, 80);
      });
      ro.observe(document.getElementById('terminal-container'));
    }

    positionScrollBtn();

    // ── Wake Lock ──────────────────────────────────────────────────────────
    let wakeLock = null;
    async function acquireWakeLock() {
      if (!('wakeLock' in navigator)) return;
      try { wakeLock = await navigator.wakeLock.request('screen'); } catch {}
    }
    function releaseWakeLock() {
      if (wakeLock) { wakeLock.release(); wakeLock = null; }
    }
    document.addEventListener('visibilitychange', () => {
      const s = sessions.get(activeId);
      if (document.visibilityState === 'visible' && s && s.ws?.readyState === WebSocket.OPEN)
        acquireWakeLock();
    });

    // ── Pinch-to-zoom font size (applies to all sessions for consistency) ──
    const termContainer = document.getElementById('terminal-container');
    let pinchStartDist     = 0;
    let pinchStartFontSize = savedFontSize;

    termContainer.addEventListener('touchstart', e => {
      if (e.touches.length === 2) {
        pinchStartDist     = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY,
        );
        pinchStartFontSize = currentFontSize;
      }
    }, { passive: true });

    termContainer.addEventListener('touchmove', e => {
      if (e.touches.length !== 2) return;
      const dist  = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY,
      );
      const newSize = Math.min(28, Math.max(8, Math.round(pinchStartFontSize * dist / pinchStartDist)));
      if (newSize !== currentFontSize) {
        currentFontSize = newSize;
        for (const s of sessions.values()) s.setFontSize(newSize);
        localStorage.setItem('pd-font-size', newSize);
      }
    }, { passive: true });

    const input = document.getElementById('cmd-input');
    const composerError = document.getElementById('composer-error');
    const sendButton = document.getElementById('send-btn');
    const isTouch = () => window.matchMedia('(pointer: coarse)').matches;
    document.getElementById('composer-hint').textContent = isTouch()
      ? 'Hold text to copy · Return adds a line'
      : 'Drag to copy · Shift+Enter for a new line';
    const drafts = new Map();
    function readDraft(id) {
      try { return sessionStorage.getItem(`pd-draft:${id}`) || drafts.get(id) || ''; }
      catch { return drafts.get(id) || ''; }
    }
    function storeDraft(id, text) {
      if (!id) return;
      drafts.set(id, text);
      try {
        if (text) sessionStorage.setItem(`pd-draft:${id}`, text);
        else sessionStorage.removeItem(`pd-draft:${id}`);
      } catch { /* In-memory drafts still survive session switches. */ }
    }
    function saveDraft() { storeDraft(activeId, input.value); }
    function resizeComposer() {
      input.style.height = 'auto';
      input.style.height = Math.min(160, input.scrollHeight + 2) + 'px';
    }
    input.addEventListener('input', () => { saveDraft(); resizeComposer(); });
    input.addEventListener('focus', () => sessions.get(activeId)?.selection.clear());
    if (window.innerWidth >= 768) input.focus();

    // ── Command history ────────────────────────────────────────────────────
    const cmdHistory = [];
    let historyIndex = -1;

    function historyUp() {
      if (!cmdHistory.length) return;
      historyIndex = Math.min(historyIndex + 1, cmdHistory.length - 1);
      input.value = cmdHistory[historyIndex];
      saveDraft(); resizeComposer();
      setTimeout(() => input.setSelectionRange(input.value.length, input.value.length), 0);
    }

    function historyDown() {
      if (historyIndex <= 0) { historyIndex = -1; input.value = ''; saveDraft(); resizeComposer(); return; }
      historyIndex--;
      input.value = cmdHistory[historyIndex];
      saveDraft(); resizeComposer();
      setTimeout(() => input.setSelectionRange(input.value.length, input.value.length), 0);
    }

    input.addEventListener('keydown', e => {
      if (e.isComposing || e.keyCode === 229) return;
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey || (!e.shiftKey && !isTouch()))) {
        e.preventDefault(); sendText();
      } else if (e.altKey && e.key === 'ArrowUp') { e.preventDefault(); historyUp(); }
      else if (e.altKey && e.key === 'ArrowDown') { e.preventDefault(); historyDown(); }
    });

    // ── Session-switch row (was: tmux row) ─────────────────────────────────
    // TAKES THE DEFAULT PROVIDER, deliberately and by omission. This is one of
    // two new-tab paths with no UI (the other is the Ctrl-B c prefix binding
    // that calls it), so there is nowhere to put a picker: a keyboard chord has
    // no room for a choice and inventing a second chord per provider would
    // scale with the registry. Said out loud here because a silent default on a
    // keyboard path is how the second harness becomes undiscoverable; the
    // discoverable path is the two buttons in the session list.
    async function tmuxNew() {
      await createSession();
    }

    function cycleActive(delta) {
      const shown = shownOrder();
      if (shown.length < 2) return;
      const idx  = shown.indexOf(activeId);
      const next = shown[(idx + delta + shown.length) % shown.length];
      setActive(next);
    }

    function tmuxLast() {
      if (previousId && sessions.has(previousId)) setActive(previousId);
      else cycleActive(+1);
    }

    // Kill is two taps: ✕ arms it, a second tap inside the window does it.
    // It sits between Refresh and the arrow keys on a row people thumb blindly,
    // and the thing it destroys is a live Claude session, so a single stray tap
    // being enough was the problem.
    //
    // Arming is deliberately per-session: switching sessions or opening the
    // list disarms, or you could arm on one session, switch, and destroy a
    // different one with the confirming tap.
    // The element is looked up per call rather than captured in a module-level
    // const: disarmKill() is called from setActive(), which is defined far
    // above this point, and a captured const would be in its temporal dead zone
    // if init order ever changed. State lives on the button itself for the same
    // reason — no module-scope binding to get ahead of.
    const KILL_ARM_MS = 4000;
    let killTimer = null;

    function disarmKill() {
      clearTimeout(killTimer);
      killTimer = null;
      const btn = document.getElementById('kill-btn');
      if (!btn) return;
      delete btn.dataset.armed;
      btn.textContent = '✕';
      btn.classList.remove('armed');
      btn.title = 'Kill this session';
    }

    function killPressed() {
      const btn = document.getElementById('kill-btn');
      if (!btn) return;
      if (btn.dataset.armed === 'true') {
        disarmKill();
        tmuxKill();
        return;
      }
      btn.dataset.armed = 'true';
      btn.textContent = 'Kill?';
      btn.classList.add('armed');
      btn.title = 'Tap again to kill this session';
      clearTimeout(killTimer);
      killTimer = setTimeout(disarmKill, KILL_ARM_MS);
    }

    async function tmuxKill() {
      closeSessionList();
      const id = activeId;
      if (!id) return;
      // Never have zero sessions — create a replacement first if this is the last.
      if (order.length === 1) await createSession();
      else cycleActive(+1);
      await deleteSession(id);
    }

    // ── Actions ────────────────────────────────────────────────────────────
    // Refit the live grid and ask tmux to repaint it.
    async function refreshTerminal() {
      if (!activeId) return;
      const s = sessions.get(activeId);
      if (s) {
        s.selection.clear();
        s.fitAndResize();
        s.term.refresh(0, s.term.rows - 1);
      }
      await post('/refresh', { session: activeId });
    }

    const pendingSends = new Set();
    async function sendText() {
      const text = input.value, id = activeId;
      if (!text.trim() || !id || pendingSends.has(id)) return;
      pendingSends.add(id);
      sendButton.disabled = true;
      composerError.hidden = true;
      saveDraft();
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 15000);
      try {
        const response = await fetch('/send', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session: id, text, bracketedPaste: !!sessions.get(id)?.term.modes.bracketedPasteMode }),
          signal: controller.signal,
        });
        if (!response.ok) throw new Error(`Server returned ${response.status}`);
        if (cmdHistory[0] !== text) cmdHistory.unshift(text);
        historyIndex = -1;
        if (activeId === id && input.value === text) {
          input.value = ''; saveDraft(); resizeComposer();
        } else if (activeId !== id && readDraft(id) === text) storeDraft(id, '');
      } catch {
        if (activeId === id) {
          composerError.textContent = 'Could not confirm delivery. Your draft is saved. Check the session before retrying.';
          composerError.hidden = false;
        }
      } finally {
        clearTimeout(timeout);
        pendingSends.delete(id);
        sendButton.disabled = pendingSends.has(activeId);
      }
    }

    async function sendKey(key) {
      if (!activeId) return;
      await post('/key', { session: activeId, key });
    }

    async function post(url, body) {
      try {
        await fetch(url, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify(body),
        });
      } catch (e) { console.error('Request failed:', e); }
    }

    // ── Default mode + go ──────────────────────────────────────────────────
    document.body.dataset.view = 'session';
    document.body.dataset.mode = 'live';
    // Expose `term` immediately under ?test=1 so static-mode render tests can
    // confirm the module script ran to completion before bootstrap finishes.
    // Real sessions overwrite this as soon as the first one is created/attached.
    if (TEST_MODE) window.term = {};
    bootstrap().then(scheduleMetaPoll);

    // Expose pre-existing functions on window so HTML inline `onclick` handlers can reach them
    // (the `<script type="module">` change scoped these to the module otherwise).
    Object.assign(window, {
      sendText, sendKey, scrollToBottom, toggleCollapse, refreshTerminal, killPressed,
      tmuxNew, tmuxLast, tmuxKill,
    });
  </script>
</body>
</html>
